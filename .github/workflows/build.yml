name: Build Couch TV Custom
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Fetch upstream
        run: git clone --depth 1 https://github.com/Seagey/couch-tv.git upstream
      - name: Build phone remote
        working-directory: upstream/remote
        run: |
          npm ci
          npm run build
      - name: Apply native and web customizations
        run: python3 patches/apply_custom.py upstream
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build signed Android APK
        working-directory: upstream/on-tv/android
        run: gradle assembleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CouchTV-Custom-APK
          path: upstream/on-tv/android/app/build/outputs/apk/release/*.apk
