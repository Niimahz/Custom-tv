name: Build Couch TV Custom
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use preinstalled Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME/platforms" || true
      - name: Fetch upstream
        run: git clone --depth 1 https://github.com/Seagey/couch-tv.git upstream
      - name: Build phone remote
        working-directory: upstream/remote
        run: |
          npm ci
          npm run build
      - name: Apply native and web customizations
        run: python3 patches/apply_custom.py upstream
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build signed Android APK
        working-directory: upstream/on-tv/android
        run: gradle assembleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CouchTV-Custom-APK
          path: upstream/on-tv/android/app/build/outputs/apk/release/*.apk

  windows:
    needs: android
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: CouchTV-Custom-APK
          path: payload
      - name: Download ADB platform tools
        shell: pwsh
        run: |
          Invoke-WebRequest https://dl.google.com/android/repository/platform-tools-latest-windows.zip -OutFile tools.zip
          Expand-Archive tools.zip -DestinationPath .
          Copy-Item (Get-ChildItem payload -Filter *.apk | Select-Object -First 1).FullName CouchTV-Custom.apk
      - name: Build EXE
        shell: pwsh
        run: |
          python -m pip install pyinstaller
          pyinstaller --noconfirm --onefile --windowed --name CouchTV-Custom-Setup --add-data "CouchTV-Custom.apk;." --add-data "platform-tools;platform-tools" windows/installer.py
      - uses: actions/upload-artifact@v4
        with:
          name: CouchTV-Custom-Windows-Installer
          path: dist/CouchTV-Custom-Setup.exe
